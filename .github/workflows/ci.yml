name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-names.sh

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [engine, sidecar, controlplane, clients/go, gen/go]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - name: example service builds
        working-directory: examples/go-service
        run: GOWORK=off GOFLAGS=-mod=mod go vet .
      - name: compose file is valid
        run: docker compose -f deploy/compose/docker-compose.yml config -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: if [ -f ui/package.json ]; then echo "ui=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.present.outputs.ui == 'true'
        working-directory: ui
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run check
          npm run test --if-present
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/gearbox-server deploy/helm/gearbox-sidecar
      - run: helm template gearbox deploy/helm/gearbox-server > /dev/null
