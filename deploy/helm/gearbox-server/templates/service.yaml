apiVersion: v1
kind: Service
metadata:
  name: {{ include "gearbox-server.fullname" . }}
  labels:
    {{- include "gearbox-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "gearbox-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
