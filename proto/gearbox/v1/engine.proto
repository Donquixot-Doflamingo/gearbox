// Gearbox sidecar API.
//
// Served by gearbox-sidecar on a Unix domain socket inside the pod
// (default unix:///var/run/gearbox/engine.sock) and optionally on loopback
// TCP. Apps call it; nothing else does. Every response carries the exact
// version that produced it.
//
// Limits are enforced by the server (not by annotations): decision name
// 1-128 chars, input_json <= GEARBOX_MAX_INPUT_BYTES (256 KiB), batch <= 100.
//
// Compatibility: buf STANDARD lint, `buf breaking --against main` with the
// FILE rule set. Never reuse or renumber fields. Breaking changes go into
// gearbox.v2. Generated Go code is published as its own module,
// github.com/ORG/gearbox/gen/go, so callers can `go get` it.

syntax = "proto3";

package gearbox.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/ORG/gearbox/gen/go/gearbox/v1;gearboxv1";
option java_multiple_files = true;
option java_package = "org.gearbox.v1";

service EngineService {
  // Evaluate one decision: rule set, decision table, transform or graph.
  rpc Decide(DecideRequest) returns (DecideResponse);

  // Evaluate several decisions in one round trip. Items are independent;
  // one failing item does not fail the others.
  rpc DecideBatch(DecideBatchRequest) returns (DecideBatchResponse);

  // Evaluate a feature gate.
  rpc CheckGate(CheckGateRequest) returns (CheckGateResponse);

  // Assign a unit to an experiment variant (respects layers and holdouts).
  rpc GetVariant(GetVariantRequest) returns (GetVariantResponse);

  // Active versions, sync state and readiness of this sidecar.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message DecideRequest {
  // Decision name, for example "lead_routing".
  string decision = 1;

  // Input document. Send JSON bytes (fastest from most languages) or a Struct.
  oneof input {
    // Limit matches GEARBOX_MAX_INPUT_BYTES (default 256 KiB).
    bytes input_json = 2;
    google.protobuf.Struct input_struct = 3;
  }

  // Caller's request ID; echoed in logs and traces. Generated if empty.
  string request_id = 4;

  // Stable unit for percentage rollouts and experiments (user ID, lead ID...).
  // Empty means "no unit": the unit is outside every partial rollout (it gets
  // the previous release version and rules with a rollout do not match) and
  // outside every experiment (reason "no_unit").
  string unit_id = 5;

  DecideOptions options = 6;
}

message DecideOptions {
  // Return timings per node in `path`.
  bool trace = 1;

  // Evaluate a specific version that is present in the active bundle
  // (for replay and debugging). Empty means the live version.
  string pin_version = 2;

  // Force a decision-log record for this call regardless of sampling.
  bool force_log = 3;

  // Value of ctx.now for this call. Empty means the sidecar clock.
  // Set it when replaying a logged request so time-based rules give the same
  // answer.
  google.protobuf.Timestamp now = 4;
}

message DecideResponse {
  // Output document as JSON.
  bytes output_json = 1;

  // "lead_routing@v17".
  string decision_version = 2;

  // Bundle generation the answer came from.
  int64 bundle_generation = 3;

  // Executed nodes, in order. Always filled; NodeStep.micros only when
  // options.trace is true.
  repeated NodeStep path = 4;

  // True when a fallback edge or the decision's fallback produced the output.
  bool fallback_used = 5;

  // Evaluation time inside the sidecar, excluding transport.
  int64 eval_micros = 6;

  string request_id = 7;

  // ctx.now used for this call (echo of options.now or the sidecar clock).
  google.protobuf.Timestamp evaluated_at = 8;

  // Hash of the decision version plus every segment, lookup, gate and
  // experiment version it read. Two calls with the same dependency_hash,
  // input, unit_id and evaluated_at give the same output (AI nodes excepted).
  string dependency_hash = 9;
}

message NodeStep {
  string node_id = 1; // "eligibility"
  string node_type = 2; // rules | table | transform | switch | lookup | gate | experiment | subdecision | ai | output
  string outcome = 3; // matched rule ID, table row ID, switch case, "fallback", "error", "shadow"
  int64 micros = 4; // filled when options.trace is true
}

message DecideBatchRequest {
  repeated DecideRequest items = 1;
}

message DecideBatchResponse {
  repeated DecideBatchItem items = 1; // same order as the request
}

message DecideBatchItem {
  // Set when the item succeeded.
  DecideResponse response = 1;
  // Set when the item failed.
  ItemError error = 2;
}

message ItemError {
  int32 code = 1;     // google.rpc.Code value, e.g. 3 = INVALID_ARGUMENT
  string reason = 2;  // same reasons as single calls: DECISION_NOT_FOUND, INPUT_SCHEMA, ...
  string message = 3;
}

message CheckGateRequest {
  string gate = 1;
  string unit_id = 2;
  bytes attributes_json = 3;
  string request_id = 4;
}

message CheckGateResponse {
  bool value = 1;
  string gate_version = 2; // "new_checkout@v5"
  string rule_id = 3; // matched rule, or "default", "killed", "disabled", "no_unit"
  int64 bundle_generation = 4;
}

message GetVariantRequest {
  string experiment = 1;
  string unit_id = 2;
  bytes attributes_json = 3;
  string request_id = 4;
}

message GetVariantResponse {
  bool in_experiment = 1;
  string variant = 2; // "control", "treatment_a"...
  bytes parameters_json = 3; // variant parameters
  string reason = 4; // "assigned", "holdout", "not_targeted", "layer_conflict", "stopped", "no_unit"
  string experiment_version = 5;
  int64 bundle_generation = 6;
}

message GetStatusRequest {}

message GetStatusResponse {
  bool ready = 1; // a verified bundle is active
  string app = 2;
  string environment = 3;
  int64 bundle_generation = 4;
  google.protobuf.Timestamp last_sync_time = 5;
  google.protobuf.Timestamp last_swap_time = 6;
  string last_sync_error = 7;
  string sidecar_version = 8;
  repeated DecisionInfo decisions = 9;
  string engine_version = 10; // compared with the bundle's min_engine_version
}

message DecisionInfo {
  string name = 1;
  string version = 2;
  string kind = 3; // rules | table | transform | graph | gate | experiment
}
