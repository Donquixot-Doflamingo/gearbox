# Code generation for gen/go. From the repository root:
#   buf generate proto --template gen/go/buf.gen.yaml
# Plugin versions must match gen/go/go.mod (protobuf v1.36.10,
# protoc-gen-go-grpc v1.5.1) so the output equals the committed code.
version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: [module=github.com/ORG/gearbox/gen/go]
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: [module=github.com/ORG/gearbox/gen/go]
