[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gearbox-client"
version = "0.1.0"
description = "Thin Python wrapper for the Gearbox sidecar (deadline, fallback, request ID). Needs stubs generated from engine.proto."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["grpcio>=1.66", "protobuf>=5.27"]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.66", "pytest>=8"]

[tool.setuptools]
# gearbox/v1/*_pb2*.py are generated into ./gen by scripts/gen.sh (see README).
package-dir = { "" = ".", "gearbox" = "gen/gearbox" }
packages = ["gearbox_client", "gearbox", "gearbox.v1"]
