{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gearbox-server.fullname" . }}
  labels:
    {{- include "gearbox-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with $s.mongoUri }}
  mongo-uri: {{ . | quote }}
  {{- end }}
  {{- with $s.redisUrl }}
  redis-url: {{ . | quote }}
  {{- end }}
  {{- with $s.awsAccessKeyId }}
  aws-access-key-id: {{ . | quote }}
  {{- end }}
  {{- with $s.awsSecretAccessKey }}
  aws-secret-access-key: {{ . | quote }}
  {{- end }}
  {{- with $s.signingKey }}
  signing.key: {{ . | quote }}
  {{- end }}
  {{- with $s.hmacKey }}
  hmac.key: {{ . | quote }}
  {{- end }}
  {{- with $s.sessionKey }}
  session.key: {{ . | quote }}
  {{- end }}
  {{- with $s.oidcClientSecret }}
  oidc-client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
