# Route a used-car lead to fast_track, standard, reject or manual_review.
# Same shape as CreateLeadRoutingDecision in contracts/openapi/gearbox-admin.v1.yaml,
# plus rule r3 (field condition AND dynamic segment AND rollout segment).
kind: decisions
name: lead_routing
version: 1
description: Route a lead to fast track, standard or review
spec:
  entry: normalize
  inputSchema: { name: lead_input, version: 1 }
  nodes:
    - id: normalize
      type: transform
      outputSchema: { name: eligibility_input, version: 1 }
      fields:
        - { target: city, expr: input.lead.city }
        - { target: source, expr: input.lead.source }
        - { target: ageYears, expr: ctx.now.Year() - input.car.year }
        - { target: km, expr: input.car.km }
        - { target: price, expr: input.car.price }
        - { target: inspectionAvg, expr: 'mean(map(input.inspections ?? [], .score)) ?? 0' }
      next: eligibility

    - id: eligibility
      type: rules
      inputSchema: { name: eligibility_input, version: 1 }
      outputSchema: { name: eligibility_output, version: 1 }
      mode: first_match
      rules:
        - id: r1
          name: Blocked city
          when: { segment: blocked_cities, op: IN_SEGMENT, key: input.city }
          then: { eligible: false, reason: city_not_served }
        - id: r2
          name: Too old
          when: { field: ageYears, op: GT, value: 12 }
          then: { eligible: false, reason: car_too_old }
        - id: r3
          name: Metro premium beta
          when:
            all:
              - { field: source, op: EQ, value: app }
              - { segment: metro_premium, op: IN_SEGMENT, attributes: { city: input.city, price: input.price } }
              - { segment: beta_10pct, op: IN_SEGMENT }
          then: { eligible: true, lane: fast, reason: metro_premium_beta }
        - id: r4
          name: Fast lane
          rollout: { percent: 25, salt: eligibility.r4 }
          when:
            all:
              - { field: price, op: BETWEEN, value: 300000, valueTo: 2500000 }
              - { field: source, op: IN, value: [app, web] }
              - { field: inspectionAvg, op: GTE, value: 7 }
              - { segment: metro_premium, op: NOT_IN_SEGMENT, attributes: { city: input.city, price: input.price } }
          then: { eligible: true, lane: fast, reason: fast_lane }
      default: { eligible: true, lane: standard, reason: default }
      next: output

    - id: output
      type: output
      fields:
        - { target: route, expr: 'nodes.eligibility.eligible ? (nodes.eligibility.lane == "fast" ? "fast_track" : "standard") : "reject"' }
        - { target: reason, expr: nodes.eligibility.reason }

  output: { schema: { name: routing_output, version: 1 } }
  fallback: { route: manual_review, reason: fallback }
  logging: { sample: 0.05, fields: [lead.city, lead.source, car.year, route, reason] }

  # Tests avoid outcomes that depend on a unit's rollout bucket, so they pass
  # whatever bucketing fixtures the engine ends up with.
  tests:
    - name: standard lane when inspection is weak
      ctx: { now: '2026-10-30T10:00:00Z', unit: L-1029384 }
      input:
        lead: { id: L-1029384, city: Gurgaon, source: app }
        car: { year: 2019, km: 48200, price: 525000 }
        inspections: [ { part: engine, score: 8 }, { part: body, score: 5 }, { part: ac, score: 5.5 } ]
      expect: { route: standard, reason: default }
    - name: blocked city is rejected
      ctx: { now: '2026-10-30T10:00:00Z', unit: L-2 }
      input:
        lead: { id: L-2, city: Leh, source: web }
        car: { year: 2021, km: 12000, price: 690000 }
      expect: { route: reject, reason: city_not_served }
      expectPath: ['normalize:ok', 'eligibility:r1', 'output:ok']
    - name: old car is rejected
      ctx: { now: '2026-10-30T10:00:00Z', unit: L-3 }
      input:
        lead: { id: L-3, city: Pune, source: app }
        car: { year: 2010, km: 160000, price: 210000 }
      expect: { route: reject, reason: car_too_old }
    - name: fast-lane rule never matches without a unit
      ctx: { now: '2026-10-30T10:00:00Z' }
      input:
        lead: { id: L-4, city: Pune, source: app }
        car: { year: 2020, km: 30000, price: 650000 }
        inspections: [ { part: engine, score: 9 }, { part: body, score: 8 } ]
      expect: { route: standard, reason: default }
    - name: missing car fails the input schema
      ctx: { now: '2026-10-30T10:00:00Z', unit: L-5 }
      input:
        lead: { id: L-5, city: Pune }
      expectError: INPUT_SCHEMA
