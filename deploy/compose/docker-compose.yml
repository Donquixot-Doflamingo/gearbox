# Gearbox local stack: server (memory or MongoDB store) + MinIO (S3) + MongoDB + Redis
# + one sidecar + the example Go service. See README.md.
#   cd deploy/compose && docker compose up --build
name: gearbox

x-dev-credential: &dev-credential ${GEARBOX_DEV_CREDENTIAL:-gbx_cred_dev_local_0000000000000000}
x-s3: &s3
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-gearbox}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-gearbox-dev-secret}

services:
  # One-shot: create the dev signing key and its trusted-keys line in the keys volume.
  keygen:
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.server }
    image: gearbox-server:dev
    entrypoint: ["/gearboxctl", "keys", "generate", "--out", "/keys", "--id", "dev-local", "--if-missing"]
    volumes: [ "keys:/keys" ]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gearbox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gearbox-dev-secret}
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio:/data" ]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  # One-shot: create the bundle bucket.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: { minio: { condition: service_healthy } }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-gearbox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-gearbox-dev-secret}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb -p local/gearbox-bundles
    restart: "no"

  mongo:
    image: mongo:7.0
    ports: [ "27017:27017" ]
    volumes: [ "mongo:/data/db" ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  server:
    image: gearbox-server:dev
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.server }
    depends_on:
      keygen: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["--seed"]
    environment:
      <<: *s3
      GEARBOX_HTTP_ADDR: ":8080"
      GEARBOX_PUBLIC_URL: http://localhost:8080
      GEARBOX_STORE: ${GEARBOX_STORE:-memory}          # set GEARBOX_STORE=mongo to keep data
      GEARBOX_MONGO_URI: mongodb://mongo:27017
      GEARBOX_MONGO_DB: gearbox
      GEARBOX_REDIS_URL: redis://redis:6379/0
      GEARBOX_OBJECT_STORE: s3://gearbox-bundles/bundles
      GEARBOX_S3_ENDPOINT: http://minio:9000
      GEARBOX_S3_REGION: us-east-1
      GEARBOX_S3_FORCE_PATH_STYLE: "true"
      GEARBOX_S3_PRESIGN_ENDPOINT: http://minio:9000   # sidecars in this network reach MinIO here
      GEARBOX_SIGNING_KEY_FILE: /keys/signing.key
      GEARBOX_SIGNING_KEY_ID: dev-local
      GEARBOX_AUTH_MODE: dev
      GEARBOX_ADMIN_EMAILS: dev@example.com
      GEARBOX_SEED_DIR: /examples/definitions
      GEARBOX_SEED_CREDENTIAL: *dev-credential
      GEARBOX_UI_DIR: /ui
      GEARBOX_LOG_LEVEL: info
    ports: [ "8080:8080", "9465:9464" ]
    volumes: [ "keys:/keys:ro" ]

  sidecar:
    image: gearbox-sidecar:dev
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.sidecar }
    depends_on:
      server: { condition: service_started }
    environment:
      GEARBOX_SERVER_URL: http://server:8080
      GEARBOX_APP: lead_service
      GEARBOX_ENV: dev
      GEARBOX_CREDENTIAL: *dev-credential
      GEARBOX_TRUSTED_KEYS_FILE: /keys/trusted-keys.txt
      GEARBOX_SOCKET: /var/run/gearbox/engine.sock
      GEARBOX_SIDECAR_ID: compose-sidecar-1
      GEARBOX_LOG_SINK: server
      GEARBOX_LOG_SAMPLE: "1"
    ports: [ "9464:9464" ]
    volumes:
      - "socket:/var/run/gearbox"
      - "sidecar-cache:/var/cache/gearbox"
      - "keys:/keys:ro"
    healthcheck:
      test: ["CMD", "/gearbox-sidecar", "healthcheck"]
      interval: 2s
      retries: 60

  lead-service:
    image: gearbox-example:dev
    build: { context: ../.., dockerfile: deploy/docker/Dockerfile.example }
    depends_on:
      sidecar: { condition: service_healthy }
    environment:
      GEARBOX_TARGET: unix:///var/run/gearbox/engine.sock
      EXAMPLE_ADDR: ":8081"
    ports: [ "8081:8081" ]
    volumes: [ "socket:/var/run/gearbox" ]

volumes:
  keys: {}
  minio: {}
  mongo: {}
  socket: {}
  sidecar-cache: {}
