openapi: 3.1.0
info:
  title: Integration Hub AI completions (PLACEHOLDER)
  version: 0.0.1-placeholder
  description: |
    Placeholder contract used by the Gearbox sidecar for AI nodes.
    The real Integration Hub contract was not available when this was written.
    Replace this file with the Hub team's spec and update sidecar/internal/hub only.
servers:
  - url: https://integration-hub.example.internal
paths:
  /v1/ai/completions:
    post:
      operationId: createCompletion
      summary: Ask a model for a JSON answer that matches a schema
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 200 }
          description: request_id + ":" + node_id, so retries do not double-bill
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompletionRequest' }
      responses:
        '200':
          description: Answer produced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '408': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
    CompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: Model alias resolved by the Hub, example: reasoning-default }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        response_schema:
          type: object
          description: JSON Schema the answer must match
          additionalProperties: true
        max_output_tokens: { type: integer, minimum: 1, maximum: 8192 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        timeout_ms: { type: integer, minimum: 1 }
        metadata:
          type: object
          additionalProperties: { type: string }
          description: decision version, node ID, request ID (for Hub-side logs)
    CompletionResponse:
      type: object
      required: [output, model]
      properties:
        output:
          type: object
          additionalProperties: true
          description: The model's answer, already parsed as JSON
        model: { type: string, description: Concrete model that answered }
        usage:
          type: object
          properties:
            input_tokens: { type: integer }
            output_tokens: { type: integer }
        latency_ms: { type: integer }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: RATE_LIMITED }
        message: { type: string }
        retry_after_ms: { type: integer }
