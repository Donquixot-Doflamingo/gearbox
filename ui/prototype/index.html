<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Gearbox Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar (app + environment) · left nav rail · one working column of panels.
   Rail turns into a scroll strip under 900px; multi-column panels stack under 860px. */
:root{
  --bg:#F1F3F6; --surface:#FFFFFF; --surface-2:#E8ECF1; --line:#D2D9E1; --line-strong:#B5C0CC;
  --fg:#131920; --muted:#586575; --accent:#2346C4; --accent-fg:#FFFFFF; --accent-soft:#E1E7FA;
  --ok:#16774A; --ok-soft:#DBF0E4; --warn:#8F5C06; --warn-soft:#F7EBD0; --crit:#B3261B; --crit-soft:#F9E0DC;
  --t-rules:#2346C4; --t-table:#0B7883; --t-transform:#7A3FB8; --t-switch:#586575; --t-ai:#A05500;
  --t-output:#16774A; --t-lookup:#8A4A2D; --t-graph:#131920;
  --code-bg:#F6F8FA; --scrim:rgb(12 16 22 / .45);
  --shadow:0 1px 2px rgb(19 25 32 / .06), 0 10px 28px rgb(19 25 32 / .10);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F14; --surface:#141920; --surface-2:#1B2129; --line:#28303A; --line-strong:#3A4451;
    --fg:#E3E8EE; --muted:#96A2B0; --accent:#8CA6FF; --accent-fg:#0C0F14; --accent-soft:#1C2545;
    --ok:#55C78B; --ok-soft:#11301F; --warn:#E6AE4A; --warn-soft:#33270E; --crit:#FF8D80; --crit-soft:#3A1612;
    --t-rules:#8CA6FF; --t-table:#4CC8D2; --t-transform:#C39BF2; --t-switch:#96A2B0; --t-ai:#F0A54A;
    --t-output:#55C78B; --t-lookup:#E1A07E; --t-graph:#E3E8EE;
    --code-bg:#10151B; --scrim:rgb(0 0 0 / .6);
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#141920; --surface-2:#1B2129; --line:#28303A; --line-strong:#3A4451;
  --fg:#E3E8EE; --muted:#96A2B0; --accent:#8CA6FF; --accent-fg:#0C0F14; --accent-soft:#1C2545;
  --ok:#55C78B; --ok-soft:#11301F; --warn:#E6AE4A; --warn-soft:#33270E; --crit:#FF8D80; --crit-soft:#3A1612;
  --t-rules:#8CA6FF; --t-table:#4CC8D2; --t-transform:#C39BF2; --t-switch:#96A2B0; --t-ai:#F0A54A;
  --t-output:#55C78B; --t-lookup:#E1A07E; --t-graph:#E3E8EE;
  --code-bg:#10151B; --scrim:rgb(0 0 0 / .6);
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px rgb(0 0 0 / .4);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:8px;z-index:60;background:var(--surface);padding:6px 10px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:750;font-size:19px;font-stretch:82%;line-height:1;margin-right:6px;color:var(--fg);text-decoration:none}
.brand svg{color:var(--accent);flex:none}
select,input[type=search],input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:6px 10px;min-height:34px}
input::placeholder{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;flex:none}
.seg button{font:500 12.5px/1 var(--f-mono);padding:10px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.seg button[data-env="prod"][aria-checked="true"]{background:var(--crit);color:var(--surface)}
.search{flex:1 1 200px;min-width:0}
.search input{width:100%}
.proto-tag{font:500 11px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--warn);background:var(--warn-soft);padding:7px 8px;border-radius:4px;white-space:nowrap}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--f-body);flex:none}

/* shell */
.layout{display:grid;grid-template-columns:196px minmax(0,1fr);gap:28px;max-width:1480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);align-self:start;display:flex;flex-direction:column;gap:18px}
.rail .grp{display:flex;flex-direction:column;gap:1px}
.rail h3{font:600 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px 10px}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.count{font:500 11px/1 var(--f-mono);padding:3px 6px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.count.warn{background:var(--warn-soft);color:var(--warn)}
@media (max-width:900px){
  .topbar{position:static}
  .layout{grid-template-columns:minmax(0,1fr);gap:14px;padding-block:12px 56px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:2px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .rail .grp{flex-direction:row;gap:2px}
  .rail h3{display:none}
  .rail a{white-space:nowrap}
}

/* page furniture */
main{min-width:0;display:flex;flex-direction:column;gap:20px}
main:focus{outline:none}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.page-head > div:first-child{min-width:0}
.eyebrow{margin:0 0 6px;font:500 12px/1.3 var(--f-mono);color:var(--muted)}
.eyebrow a{color:inherit}
h1{margin:0;font-family:var(--f-display);font-weight:720;font-size:28px;line-height:1.1;font-stretch:86%;text-wrap:balance;overflow-wrap:anywhere}
h2{margin:0;font-family:var(--f-display);font-weight:650;font-size:16px;line-height:1.25;font-stretch:92%;text-wrap:balance}
h3.sub-h{margin:0;font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sub{margin:6px 0 0;color:var(--muted);max-width:65ch}
p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px/1 var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;min-height:36px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{background:var(--crit);border-color:var(--crit);color:var(--surface)}
.btn-danger:hover{background:var(--crit);filter:brightness(1.08)}
.btn-sm{padding:6px 10px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}
.hint{font-size:12.5px;color:var(--muted)}
.hint.warn{color:var(--warn)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px}
.nowrap{white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:14px}
.panel > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.grid-side{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:20px;align-items:start}
.grid-3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.grid-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){.grid-2,.grid-side{grid-template-columns:minmax(0,1fr)}}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:7px;min-width:0}
.tile .label{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;gap:6px;align-items:center}
.tile .value{font-family:var(--f-display);font-weight:720;font-size:28px;line-height:1;font-stretch:86%;font-variant-numeric:tabular-nums}
.tile .value small{font:500 13px/1 var(--f-mono);color:var(--muted);margin-left:4px}
.tile .note{font-size:12.5px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.crit{background:var(--crit)} .dot.info{background:var(--accent)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.panel .tbl-wrap{border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover td{background:var(--surface-2)}
tbody tr.selected td{background:var(--accent-soft)}
td .desc{display:block;color:var(--muted);font-size:12.5px;max-width:42ch}
td a.name{font:500 13.5px/1.3 var(--f-mono);text-decoration:none}
td a.name:hover{text-decoration:underline}
td .name-plain{font:500 13.5px/1.3 var(--f-mono)}
th.cur, td.cur{background:var(--accent-soft)}

.pill{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--f-body);padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)} .pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-crit{background:var(--crit-soft);color:var(--crit)} .pill-info{background:var(--accent-soft);color:var(--accent)}
.pill-muted{background:var(--surface-2);color:var(--muted)}
.kind{display:inline-flex;align-items:center;gap:6px;font:500 12px/1 var(--f-mono);color:var(--k);white-space:nowrap}
.kind::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--k)}
.ver{display:inline-block;font:500 12px/1 var(--f-mono);padding:4px 6px;border-radius:4px;border:1px solid var(--line);white-space:nowrap}
.ver.draft{border-style:dashed;color:var(--muted)}
.ver.live{border-color:var(--crit);color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12.5px/1 var(--f-body);padding:7px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters input{flex:1 1 240px;min-width:0}

pre.code{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font:400 12.5px/1.6 var(--f-mono);tab-size:2;color:var(--fg)}
.j-key{color:var(--t-rules)} .j-str{color:var(--ok)} .j-num{color:var(--t-ai)} .j-lit{color:var(--t-transform)}
.diff-add{display:block;background:var(--ok-soft);color:var(--ok)}
.diff-del{display:block;background:var(--crit-soft);color:var(--crit)}
.diff-ctx{display:block}
code.inl{font:400 12.5px/1.4 var(--f-mono);background:var(--surface-2);padding:2px 5px;border-radius:4px;overflow-wrap:anywhere}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs a,.tabs button{padding:10px 12px;border:0;background:none;font:500 13px/1 var(--f-body);color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs a:hover,.tabs button:hover{color:var(--fg)}
.tabs [aria-current="page"],.tabs [aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0;padding-bottom:0}
.list li:first-child{padding-top:0}
.list .main{min-width:0;display:flex;flex-direction:column;gap:3px}
.list .meta{font-size:12.5px;color:var(--muted)}

/* graph editor */
.canvas{background-color:var(--surface);background-image:radial-gradient(var(--line) 1px, transparent 1.2px);background-size:18px 18px;border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.graph{display:block;width:100%;min-width:980px;height:auto}
.g-node{cursor:pointer}
.g-node rect,.g-node circle{fill:var(--surface);stroke:var(--line-strong);stroke-width:1}
.g-node:hover rect,.g-node:hover circle{stroke:var(--accent)}
.g-node.sel rect,.g-node.sel circle{stroke:var(--accent);stroke-width:2;fill:var(--accent-soft)}
.g-node:focus{outline:none}
.g-node:focus-visible rect,.g-node:focus-visible circle{stroke:var(--accent);stroke-width:3}
.g-type{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.g-id{font-family:var(--f-mono);font-size:13.5px;font-weight:500;fill:var(--fg)}
.g-sub{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.g-edge{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.g-edge.err{stroke:var(--warn);stroke-dasharray:5 4}
.g-arrow{fill:var(--line-strong)} .g-arrow-err{fill:var(--warn)}
.g-label{font-family:var(--f-mono);font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.g-label.err{fill:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px}

.tests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tests li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:6px}
.tests li.fail{background:var(--crit-soft)}
.tests .mark{font:600 13px/1.4 var(--f-mono)}
.tests .pass .mark{color:var(--ok)} .tests .fail .mark{color:var(--crit)}
.tests .detail{display:block;font-size:12.5px;color:var(--crit)}

/* rule editor */
.rule-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rule-list button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 8px;padding:10px;border-radius:6px;border:1px solid transparent}
.rule-list button:hover{background:var(--surface-2)}
.rule-list button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rule-list button:focus-visible{outline:2px solid var(--accent)}
.rule-list .rid{font:500 12px/1.5 var(--f-mono);color:var(--muted)}
.rule-list .rname{font-weight:600}
.rule-list .rbar{grid-column:2;display:flex;align-items:center;gap:8px;font:400 12px/1 var(--f-mono);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--surface-2);flex:1;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cond{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1.2fr);gap:8px}
.cond-cell{font:400 12.5px/1.3 var(--f-mono);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;background:var(--surface);min-width:0;overflow-wrap:anywhere}
.cond-op{color:var(--t-transform);font-weight:500}
.join{font:600 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}
@media (max-width:560px){.cond{grid-template-columns:minmax(0,1fr)}}

/* decision table */
.dt th.out,.dt td.out{border-left:2px solid var(--line-strong)}
.dt td{font:400 12.5px/1.4 var(--f-mono)}
.dt tr.hit td{background:var(--ok-soft)}
.dt tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--ok)}
.dt .any{color:var(--muted)}
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font:600 11px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select{width:100%}
.result-line{font:500 13px/1.5 var(--f-mono);padding:10px 12px;border-radius:6px;background:var(--surface-2)}

/* transform */
.map-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.6fr);gap:6px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:start}
.map-row:last-child{border-bottom:0}
.map-row .tgt{font:500 12.5px/1.4 var(--f-mono);color:var(--t-transform);overflow-wrap:anywhere}
.map-row .ex{font:400 12.5px/1.4 var(--f-mono);overflow-wrap:anywhere}
.map-row .pv{grid-column:2;font:400 12px/1.4 var(--f-mono);color:var(--ok);overflow-wrap:anywhere}
.map-row .pv::before{content:"→ ";color:var(--muted)}

/* experiments */
.bucket{display:flex;height:38px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.bucket > div{display:flex;align-items:center;justify-content:center;font:500 11.5px/1 var(--f-mono);min-width:0;overflow:hidden;white-space:nowrap;color:var(--fg)}
.b-hold{background:var(--surface-2);color:var(--muted)!important}
.b-a{background:var(--accent-soft)} .b-b{background:var(--ok-soft)} .b-c{background:var(--warn-soft)}
.scale{display:flex;justify-content:space-between;font:400 11px/1 var(--f-mono);color:var(--muted);margin-top:4px}
.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;border:1px solid var(--line-strong);flex:none}

/* rollout stepper */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stepper li{border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.stepper .pct{font-family:var(--f-display);font-weight:720;font-size:22px;font-stretch:86%;line-height:1}
.stepper .st{font-size:12px;color:var(--muted)}
.stepper li.done{background:var(--ok-soft);border-color:transparent}
.stepper li.done .st{color:var(--ok)}
.stepper li.current{border:2px solid var(--accent);background:var(--accent-soft)}
.stepper li.current .st{color:var(--accent);font-weight:600}
@media (max-width:520px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* spread bar */
.spread{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.spread i{display:block;height:100%}
.spread .s-ok{background:var(--ok)} .spread .s-warn{background:var(--warn)}

/* path trace */
.trace{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.trace li{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 0;position:relative}
.trace li::before{content:"";position:absolute;left:6px;top:20px;bottom:-8px;width:2px;background:var(--line)}
.trace li:last-child::before{display:none}
.trace .nd{width:14px;height:14px;border-radius:3px;margin-top:3px;background:var(--k)}
.trace .nm{font:500 13px/1.4 var(--f-mono)}
.trace .oc{display:block;font-size:12.5px;color:var(--muted)}
.trace .us{font:400 12px/1.4 var(--f-mono);color:var(--muted)}

/* confusion matrix */
.cm td{font:400 13px/1.2 var(--f-mono);text-align:right}
.cm td.diag{background:var(--ok-soft);color:var(--ok);font-weight:500}
.cm th.rh{text-align:left;background:var(--surface)}

/* overlays */
.toast{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:6px;box-shadow:var(--shadow);max-width:min(380px, calc(100vw - 32px));font-size:13.5px}
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.dialog .env-callout{font:600 13px/1.4 var(--f-mono);color:var(--crit);background:var(--crit-soft);padding:8px 10px;border-radius:6px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .target{stroke:var(--crit);stroke-width:1;stroke-dasharray:4 4}
.chart .area{fill:var(--accent-soft)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2}
.chart .end{fill:var(--accent)}
.chart .endlabel{fill:var(--fg);font-weight:500}
.chart .targetlabel{fill:var(--crit)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.spacer{flex:1}
</style>

const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const code = s => `<pre class="code">${esc(s)}</pre>`;
function json(o){
  const s = esc(JSON.stringify(o, null, 2));
  return `<pre class="code">${s
    .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="j-key">$1</span>$2')
    .replace(/(:\s*|\[\s*|,\s*)(&quot;[^&]*?&quot;)/g, '$1<span class="j-str">$2</span>')
    .replace(/(:\s*)(-?\d+(?:\.\d+)?)/g, '$1<span class="j-num">$2</span>')
    .replace(/\b(true|false|null)\b/g, '<span class="j-lit">$1</span>')}</pre>`;
}
function head({eyebrow, title, sub, actions=''}){
  return `<div class="page-head" data-component="PageHeader"><div>${eyebrow ? `<p class="eyebrow">${eyebrow}</p>` : ''}<h1>${esc(title)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;

function graphSVG(){
  const W = 150, H = 64, N = Object.fromEntries(DATA.graph.nodes.map(d => [d.id, d]));
  const box = d => d.type === 'end' ? {l:d.x+12, r:d.x+48, t:d.y+14, b:d.y+50, cx:d.x+30, cy:d.y+32} : {l:d.x, r:d.x+W, t:d.y, b:d.y+H, cx:d.x+W/2, cy:d.y+H/2};
  const edges = DATA.graph.edges.map(([a,b,label,cls]) => {
    const A = box(N[a]), B = box(N[b]); let d, lx, ly;
    if (Math.abs(A.cx - B.cx) < 5){ d = `M${A.cx} ${A.b} L${B.cx} ${B.t - 4}`; lx = A.cx + 10; ly = (A.b + B.t)/2 + 4; }
    else { const x1 = A.r, y1 = A.cy, x2 = B.l - 4, y2 = B.cy, m = (x2 - x1)/2; d = `M${x1} ${y1} C${x1+m} ${y1}, ${x2-m} ${y2}, ${x2} ${y2}`; lx = (x1+x2)/2; ly = (y1+y2)/2 + 4; }
    return `<path class="g-edge${cls ? ' err' : ''}" d="${d}" marker-end="url(#${cls ? 'arr-err' : 'arr'})"/>` + (label ? `<text class="g-label${cls ? ' err' : ''}" x="${lx}" y="${ly}" text-anchor="${Math.abs(A.cx - B.cx) < 5 ? 'start' : 'middle'}">${label}</text>` : '');
  }).join('');
  const nodes = DATA.graph.nodes.map(d => {
    const sel = state.node === d.id ? ' sel' : '';
    const label = `${d.id}, ${d.type} node`;
    if (d.type === 'end') return `<g class="g-node${sel}" tabindex="0" role="button" aria-label="${label}" data-node="${d.id}"><circle cx="${d.x+30}" cy="${d.y+32}" r="18"/><text class="g-sub" x="${d.x+30}" y="${d.y+36}" text-anchor="middle">end</text></g>`;
    return `<g class="g-node${sel}" tabindex="0" role="button" aria-label="${label}" data-node="${d.id}"><rect x="${d.x}" y="${d.y}" width="${W}" height="${H}" rx="8"/>
      <text class="g-type" x="${d.x+12}" y="${d.y+19}" style="fill:var(--t-${d.type})">${d.type}</text>
      <text class="g-id" x="${d.x+12}" y="${d.y+38}">${d.id}</text><text class="g-sub" x="${d.x+12}" y="${d.y+54}">${esc(d.sub)}</text></g>`;
  }).join('');
  return `<svg class="graph" viewBox="0 0 1182 352" role="group" aria-label="lead_routing graph, 9 nodes">
    <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="g-arrow" d="M0 0 L8 4 L0 8 Z"/></marker>
    <marker id="arr-err" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path class="g-arrow-err" d="M0 0 L8 4 L0 8 Z"/></marker></defs>
    ${edges}${nodes}</svg>`;
}

function cellMatch(cell, v){
  cell = cell.trim();
  if (cell === '-') return true;
  let m;
  if ((m = cell.match(/^(<=|>=|<|>)\s*(-?\d+(?:\.\d+)?)$/))){ const x = +m[2]; return m[1] === '<' ? v < x : m[1] === '<=' ? v <= x : m[1] === '>' ? v > x : v >= x; }
  if ((m = cell.match(/^\[(-?\d+)\.\.(-?\d+)\]$/))) return v >= +m[1] && v <= +m[2];
  if (cell.startsWith('[')) { try { return JSON.parse(cell).includes(v); } catch { return false; } }
  return String(v) === cell.replace(/^"|"$/g, '');
}
const evalTable = () => DATA.table.rows.find(r => cellMatch(r.price, state.price) && cellMatch(r.age, state.age) && cellMatch(r.city, state.city));

      <tr><td class="mono">prod</td><td>1 approver, not the author</td><td>required</td><td class="mono">1%</td></tr></tbody></table></div>`;
  if (t === 'webhooks') body = `<div class="tbl-wrap"><table><thead><tr><th>URL</th><th>Events</th><th>Last delivery</th></tr></thead><tbody>
      <tr><td class="mono">https://hooks.example.com/gearbox</td><td class="mono">release.published, change.approved</td><td>${pill('ok','200 · 09:12')}</td></tr>
      <tr><td class="mono">https://chat.example.com/hooks/T0/decisions</td><td class="mono">release.rolled_back</td><td>${pill('ok','200 · Oct 29')}</td></tr></tbody></table></div>`;
  return head({eyebrow: crumb(), title:'Settings', sub:'App, access and delivery settings for lead-service.'}) +
    `<div class="tabs" role="tablist" aria-label="Settings sections" data-component="SettingsTabs">${tabs.map(([id,l]) => `<button type="button" role="tab" id="tab-${id}" aria-selected="${t === id}" aria-controls="tabpanel" data-act="tab" data-id="${id}">${l}</button>`).join('')}</div>
     <section class="stack" role="tabpanel" id="tabpanel" aria-labelledby="tab-${t}">${body}</section>`;
};

/* ---------- confirm dialog (in-page; the viewer has no native confirm) ---------- */
let lastFocus = null, onOk = null;
function confirmBox({title, body, ok, danger=true, action}){
  lastFocus = document.activeElement;
  $('#dlg-title').textContent = title; $('#dlg-body').innerHTML = body;
  const b = $('#dlg-ok'); b.textContent = ok; b.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
  onOk = action; $('#dialog').hidden = false; $('#dlg-cancel').focus();
}
function closeBox(){ $('#dialog').hidden = true; onOk = null; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
$('#dlg-cancel').addEventListener('click', closeBox);
$('#dlg-ok').addEventListener('click', () => { const f = onOk; closeBox(); if (f) f(); });
$('#dialog').addEventListener('click', e => { if (e.target.id === 'dialog') closeBox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dialog').hidden) closeBox(); });

const CONFIRMS = {
  approve: () => ({title:'Approve CR-214?', ok:'Approve', danger:false, body:`<p class="env-callout">Target: prod</p><p>lead_routing v18 and inspection_pricing_band v10 become publishable. Nothing changes for callers until someone publishes.</p>`,
    action:() => { state.crStatus = 'approved'; render(); toast('Approved CR-214'); }}),
  publish: () => ({title:'Publish CR-214 to prod?', ok:'Publish to prod', body:`<p class="env-callout">Target: prod · generation ${state.gen + 1}</p><p>Every lead-service sidecar in prod swaps to the new bundle within seconds.</p>`,
    action:() => { state.gen++; state.crStatus = 'published'; render(); toast(`Published generation ${state.gen} to prod`); }}),
  advance: () => ({title:`Go to ${STEPS[state.step+1]}%?`, ok:`Go to ${STEPS[state.step+1]}%`, body:`<p class="env-callout">Target: prod · generation ${state.gen + 1}</p><p>${STEPS[state.step+1]}% of units get lead_routing v17; the rest stay on v16.</p>`,
    action:() => { state.gen++; state.step++; render(); toast(`Published generation ${state.gen}: v17 at ${STEPS[state.step]}%`); }}),
  rollback: () => ({title:'Roll back lead_routing to v16?', ok:'Roll back', body:`<p class="env-callout">Target: prod · generation ${state.gen + 1}</p><p>All units go back to v16. This is a new generation; v17 stays available for a later rollout.</p>`,
    action:() => { state.gen++; state.rollbackDone = true; render(); toast(`Published generation ${state.gen}: lead_routing back on v16`); }}),
  kill: el => ({title:`Turn on the kill switch for ${el.dataset.name}?`, ok:'Turn off for everyone', body:`<p class="env-callout">Target: ${esc(state.env)}</p><p>The gate returns false for every unit until the kill switch is turned off.</p>`,
    action:() => { const g = DATA.gates.find(x => x.name === el.dataset.name); g.state = 'killed'; g.rollout = '0%'; render(); toast(`${g.name} is off for everyone in ${state.env}`); }}),
  stop: () => ({title:'Stop callback_timing?', ok:'Stop experiment', body:`<p class="env-callout">Target: ${esc(state.env)}</p><p>Every unit gets the control parameters from the next generation. Assignments already logged are kept.</p>`,
    action:() => toast('Stopped callback_timing; control parameters for everyone')}),
  inline: () => ({title:'Make priority inline?', ok:'Create version', danger:false, body:`<p>This creates lead_routing v19 with the AI answer deciding the route when it arrives within 1,500 ms. Callers would wait up to that long. The new version goes through review like any other.</p>`,
    action:() => toast('Created draft lead_routing v19 with priority inline')}),
  revoke: el => ({title:`Revoke ${el.dataset.name}?`, ok:'Revoke', body:`<p class="env-callout">Target: ${esc(el.dataset.env)}</p><p>Sidecars using this credential keep serving their current bundle but can no longer fetch updates.</p>`,
    action:() => { const c = DATA.credentials.find(x => x.id === el.dataset.name); c.state = 'revoked'; render(); toast(`Revoked ${c.id}`); }}),
};

/* ---------- events ---------- */
const view = $('#view');
view.addEventListener('click', e => {
  const g = e.target.closest('[data-node]');
  if (g){ state.node = g.dataset.node; render(); const again = view.querySelector(`[data-node="${state.node}"]`); if (again) again.focus(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'toast') toast(el.dataset.msg);
  if (a === 'kind'){ state.kind = el.dataset.k; render(); }
  if (a === 'rule'){ state.rule = el.dataset.id; render(); view.querySelector(`[data-id="${state.rule}"]`).focus(); }
  if (a === 'log'){ state.log = el.dataset.id; render(); view.querySelector(`tr[data-id="${state.log}"]`).focus(); }
  if (a === 'logfb'){ state.logFb = !state.logFb; if (state.logFb) state.log = DATA.logs.find(l => l.fb).id; render(); }
  if (a === 'tab'){ state.tab = el.dataset.id; render(); $(`#tab-${state.tab}`).focus(); }
  if (a === 'confirm') confirmBox(CONFIRMS[el.dataset.kind](el));
});
view.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const g = e.target.closest('[data-node], tr[data-act]');
  if (g){ e.preventDefault(); g.dispatchEvent(new MouseEvent('click', {bubbles:true})); }
});
view.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'q'){ state.q = v; const pos = e.target.selectionStart; render(); const i = $('#dec-q'); i.focus(); i.setSelectionRange(pos, pos); return; }
  if (k === 'price' || k === 'age'){ state[k] = Number(String(v).replace(/[^\d.]/g, '')) || 0; }
  else state[k] = v;
  if (k === 'price' || k === 'age' || k === 'city'){
    const hit = evalTable();
    view.querySelectorAll('.dt tbody tr').forEach((tr, i) => tr.classList.toggle('hit', !!hit && DATA.table.rows[i].id === hit.id));
    $('#table-result').textContent = hit ? `matched ${hit.id} → band ${hit.band}, max_discount ${n(hit.md)}` : 'no row matched; the node returns its default';
  }
  if (k === 'lookupKey'){ const h = DATA.cityZone.find(([x]) => x.toLowerCase() === v.trim().toLowerCase()); $('#lookup-result').textContent = h ? `lookup("city_zone", "${h[0]}") = "${h[1]}"` : 'not in the preview rows; the full table has 412 keys'; }
  if (k === 'segKey'){ const inS = DATA.blockedCities.some(c => c.toLowerCase() === v.trim().toLowerCase()); $('#seg-result').textContent = `inSegment("blocked_cities", "${v.trim()}") = ${inS}`; }
});

$('#env-seg').addEventListener('click', e => {
  const b = e.target.closest('[data-env]'); if (!b) return;
  state.env = b.dataset.env;
  document.querySelectorAll('#env-seg button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
  render(); toast(`Showing ${state.env}. Sample figures stay the same in this prototype.`);
});
$('#global-search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (DATA.traces[v]){ state.log = v; state.logFb = false; go('logs'); }
  else { state.q = v; state.kind = 'all'; go('decisions'); }
});

/* ---------- router ---------- */
function go(h){ if (location.hash === '#' + h) render(); else location.hash = h; }
function render(){
  const id = location.hash.slice(1);
  const key = V[id] ? id : 'overview';
  renderNav(key);
  view.innerHTML = V[key]();
}
window.addEventListener('hashchange', () => { render(); view.focus({preventScroll:true}); window.scrollTo(0, 0); });
render();
</script>

</body>
</html>
